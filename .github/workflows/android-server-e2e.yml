name: Build Android direct-function E2E APK

on:
  workflow_dispatch:
    inputs:
      nagram_ref:
        description: Nagram branch or tag
        required: true
        default: main
  push:
    branches: [main]
    paths:
      - "features/server-e2e/**"
      - "features/server-switch/**"
      - "features/raw-animation/**"
      - "features/direct-download/**"
      - "scripts/ci/build-e2e-nagram.sh"
      - "scripts/ci/run-raw-animation-avd-e2e.sh"
      - "tests/fixtures/raw-animation/**"
      - "src/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/android-server-e2e.yml"

permissions:
  contents: read

concurrency:
  group: android-direct-function-e2e-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: android-actions/setup-android@v4
      - name: Install Nagram native toolchain
        run: |
          (yes || true) | sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y bison gcc make curl ninja-build yasm patch ccache
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Install patcher dependencies
        run: corepack enable && yarn install --immutable
      - name: Patch and rebuild Nagram debug APK
        run: bash scripts/ci/build-e2e-nagram.sh "${{ inputs.nagram_ref || 'main' }}"
      - name: Enable KVM for the API 35 emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify GIF and APNG frames on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci/run-raw-animation-avd-e2e.sh artifacts/e2e-nagram-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: nagram-direct-function-e2e-x86_64
          path: artifacts/e2e-nagram-x86_64/
          if-no-files-found: error
          retention-days: 14
