name: Build and publish Crossgram APKs

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish one unified GitHub Release
        type: boolean
        default: true
      client:
        description: Clients to build (use all for a unified release)
        type: choice
        default: all
        options:
          - all
          - nagram
          - telegram
          - nnngram
          - nullgram
          - mercurygram
          - forkgram
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: crossgram-upstream-release
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      clients: ${{ steps.matrix.outputs.clients }}
      build: ${{ steps.matrix.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable && yarn install --immutable
      - id: matrix
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CROSSGRAM_CLIENT: ${{ inputs.client || 'all' }}
        run: yarn discover --github-output "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.discover.outputs.build) }}
    name: ${{ matrix.id }} · ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: android-actions/setup-android@v4
      - name: Install client NDK
        env:
          NDK_VERSION: ${{ matrix.ndkVersion }}
          NATIVE_DEPS_NDK_VERSION: ${{ matrix.nativeDepsNdkVersion }}
        run: |
          packages=("ndk;$NDK_VERSION" "cmake;3.22.1")
          if [[ -n "$NATIVE_DEPS_NDK_VERSION" ]]; then
            packages+=("ndk;$NATIVE_DEPS_NDK_VERSION")
          fi
          (yes || true) | sdkmanager --install "${packages[@]}"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake bison ccache cmake curl gcc gperf libtool \
            libuv1-dev make meson nasm ninja-build patch pkg-config yasm
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - run: corepack enable && yarn install --immutable
      - name: Patch and build five branded APKs
        env:
          CROSSGRAM_KEYSTORE_BASE64: ${{ secrets.CROSSGRAM_KEYSTORE_BASE64 }}
          CROSSGRAM_KEYSTORE_PASSWORD: ${{ secrets.CROSSGRAM_KEYSTORE_PASSWORD }}
          CROSSGRAM_KEY_ALIAS: ${{ secrets.CROSSGRAM_KEY_ALIAS }}
          CROSSGRAM_KEY_PASSWORD: ${{ secrets.CROSSGRAM_KEY_PASSWORD }}
          CROSSGRAM_TELEGRAM_API_ID: ${{ secrets.CROSSGRAM_TELEGRAM_API_ID }}
          CROSSGRAM_TELEGRAM_API_HASH: ${{ secrets.CROSSGRAM_TELEGRAM_API_HASH }}
        run: >-
          bash scripts/ci/build-upstream.sh
          "${{ matrix.id }}"
          "${{ matrix.repository }}"
          "${{ matrix.ref }}"
          "${{ matrix.version }}"
          "${{ matrix.variant }}"
          "${{ matrix.gradleTask }}"
          "${{ matrix.ndkVersion }}"
          "${{ matrix.nativeDepsNdkVersion }}"
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: apk-${{ matrix.id }}-${{ matrix.variant }}
          path: artifacts/${{ matrix.id }}/${{ matrix.variant }}/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: ${{ always() && (github.event_name == 'schedule' || inputs.publish) }}
    needs: [discover, build]
    runs-on: ubuntu-latest
    name: Publish one unified release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: apk-*
          path: release-assets
          merge-multiple: true
      - name: Publish all successful clients and architectures
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENTS_JSON: ${{ needs.discover.outputs.clients }}
        run: |
          shopt -s nullglob
          files=(release-assets/*.apk release-assets/*.txt)
          if (( ${#files[@]} == 0 )); then
            echo "No successful artifacts; skipping release."
            exit 0
          fi

          tag="crossgram-${GITHUB_RUN_NUMBER}"
          {
            echo "Unified Crossgram Android build from workflow run ${GITHUB_RUN_NUMBER}."
            echo
            echo "Included upstream revisions:"
            printf '%s' "$CLIENTS_JSON" | jq -r '.[] | "- \(.id): `\(.ref)` from \(.repository)"'
            echo
            echo "Only successful 64-bit client builds are attached. Each architecture includes QQ · Cross, 微信 · Cross, 企业微信 · Cross, 钉钉 · Cross and Discord · Cross."
          } > release-notes.md

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "Crossgram Android #${GITHUB_RUN_NUMBER}" \
              --notes-file release-notes.md
          fi
          gh release upload "$tag" "${files[@]}" --clobber
